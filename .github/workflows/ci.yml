name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

# Deny everything by default; each job grants only what it needs.
permissions: {}

# PRs: cancel the old run when you push more changes (saves CI minutes).
# main / develop pushes: never cancel — the release job lives inside this run,
# so cancelling it mid-flight would abort a release in progress.
# PRs share a group per branch (newer pushes cancel older runs); pushes to main
# get one group per commit so a publish waiting for approval never blocks or
# cancels CI for later commits.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # ─────────────────────────────────────────────────────────
  # 1. Quality — format · lint · typecheck (check only, never commit back)
  # ─────────────────────────────────────────────────────────
  quality:
    name: Quality (lint · typecheck · format)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm

      # Lockfile install, no dependency lifecycle scripts.
      - name: Install dependencies
        run: npm ci --ignore-scripts

      # Check only, never commit back: a bot commit wouldn't trigger CI, so
      # required checks would never report on it. Fix locally with
      # `npm run format && npm run lint:fix`.
      - name: Format
        run: npm run format:check

      - name: Lint
        run: npm run lint:check

      - name: Type check
        run: npm run typecheck

      - name: Type check examples
        run: npm run typecheck:examples

  # ─────────────────────────────────────────────────────────
  # 2. Tests — Node 18 / 20 / 22 matrix
  # ─────────────────────────────────────────────────────────
  test:
    name: Test (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    needs: quality
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        node-version: ['18', '20', '22']

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Run tests with coverage
        run: npm run test:coverage

      - name: Upload coverage to Codecov
        if: matrix.node-version == '22'
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  # ─────────────────────────────────────────────────────────
  # 3. Build — verify dist is producible
  # ─────────────────────────────────────────────────────────
  build:
    name: Build
    runs-on: ubuntu-latest
    needs: quality
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build
        run: npm run build

      - name: Verify dist artifacts
        run: |
          test -f dist/index.js  || (echo "dist/index.js missing"  && exit 1)
          test -f dist/index.mjs || (echo "dist/index.mjs missing" && exit 1)
          # tsdown emits .d.ts for CJS-primary packages, .d.mts for ESM-primary;
          # accept either so the check stays green regardless of future tsdown behaviour.
          test -f dist/index.d.ts || test -f dist/index.d.mts \
            || { echo "dist/index.d.ts (or .d.mts) missing"; exit 1; }
          echo "All dist artifacts present"

      - name: Check package exports
        run: npm run check:exports

      - name: Upload dist artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          retention-days: 3

  # ─────────────────────────────────────────────────────────
  # Publish dry-run — exercises the exact `npm publish` invocation the
  # `publish` job uses (same Node/npm, same tarball path form) on every PR and
  # push, before semantic-release can push a tag. Uses a throwaway prerelease
  # version because npm 11 refuses even a dry-run over a published version.
  # No id-token, no registry auth.
  # ─────────────────────────────────────────────────────────
  publish-check:
    name: Publish dry-run
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
    env:
      CHECK_VERSION: 0.0.0-ci.${{ github.run_id }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download dist artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.22.2' # keep in sync with the publish job
          registry-url: 'https://registry.npmjs.org'

      - name: Pack and dry-run publish
        run: |
          npm version "$CHECK_VERSION" --no-git-tag-version --ignore-scripts
          mkdir -p release
          npm pack --pack-destination release --ignore-scripts
          tarball_path="./release/logixia-${CHECK_VERSION}.tgz"
          npm publish "$tarball_path" --dry-run --access public --ignore-scripts --tag ci-dry-run

  # ─────────────────────────────────────────────────────────
  # 4. Release — only on direct push to main. Does NOT publish to npm.
  #
  # Runs semantic-release from the lockfile (npm ci --ignore-scripts) to
  # compute the version, write it to package.json, create the git tag and the
  # GitHub release, and pack the npm tarball (npmPublish: false + tarballDir in
  # .releaserc.json). The tarball is handed to the `publish` job as an artifact.
  #
  # This job installs dependencies, so it must never hold `id-token: write`:
  # a compromised dev dependency could otherwise mint an npm publish token.
  #
  # The checkout is github.sha (the commit that passed test + build). If main
  # moved on since, semantic-release refuses to release ("branch is behind")
  # and the newer push's run releases instead.
  # ─────────────────────────────────────────────────────────
  release:
    name: Semantic Release (version · tag · pack)
    runs-on: ubuntu-latest
    needs: [test, build, publish-check]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    concurrency:
      group: release-${{ github.ref }}
      cancel-in-progress: false
    permissions:
      contents: write # push release tag, create the GitHub release
      issues: write # comment on released issues
      pull-requests: write # comment on released PRs
    outputs:
      released: ${{ steps.pack.outputs.released }}
      version: ${{ steps.pack.outputs.version }}
      tarball: ${{ steps.pack.outputs.tarball }}
      sha256: ${{ steps.pack.outputs.sha256 }}

    steps:
      - name: Checkout (full history)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build
        run: npm run build

      - name: Semantic release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_CONFIG_IGNORE_SCRIPTS: 'true' # `npm version` / `npm pack` run no lifecycle scripts
          HUSKY: 0
        run: npx semantic-release

      # Runs even if semantic-release failed after pushing the tag (e.g. a
      # GitHub comment/label call in the success step), so the tagged version
      # still reaches npm. A tarball without a pushed tag is never published.
      - name: Locate tarball
        id: pack
        if: ${{ !cancelled() }}
        run: |
          shopt -s nullglob
          files=(release/*.tgz)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "No release was created."
            echo "released=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "${#files[@]}" -ne 1 ]; then
            echo "::error::Expected exactly one tarball in release/, found ${#files[@]}"
            exit 1
          fi
          version=$(node -p "require('./package.json').version")
          if ! git ls-remote --exit-code --tags origin "refs/tags/v${version}" > /dev/null; then
            echo "::error::Tag v${version} was not pushed; refusing to publish"
            echo "released=false" >> "$GITHUB_OUTPUT"
            exit 1
          fi
          {
            echo "released=true"
            echo "version=$version"
            echo "tarball=$(basename "${files[0]}")"
            echo "sha256=$(sha256sum "${files[0]}" | cut -d' ' -f1)"
          } >> "$GITHUB_OUTPUT"

      - name: Upload npm tarball
        if: ${{ !cancelled() && steps.pack.outputs.released == 'true' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: npm-tarball
          path: release/*.tgz
          if-no-files-found: error
          retention-days: 14

  # ─────────────────────────────────────────────────────────
  # 5. Publish — the only job with `id-token: write`.
  #
  # Installs nothing from the registry except Node itself (setup-node): it
  # downloads the tarball built by `release`, checks its SHA-256, and runs
  # `npm publish` with --ignore-scripts (no prepublishOnly). Authentication is
  # npm trusted publishing (OIDC); no npm token exists.
  #
  # Runs in the `npm` GitHub Environment so a required reviewer can gate it.
  # Failed publish? "Re-run failed jobs" only helps for transient failures
  # (registry or network): a re-run uses the workflow file from the original
  # commit, so a bug in these steps needs a fix and a new release. The
  # `publish-check` job dry-runs this same command before any tag is pushed.
  # ─────────────────────────────────────────────────────────
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    needs: release
    if: ${{ !cancelled() && needs.release.outputs.released == 'true' }}
    environment: npm
    permissions:
      id-token: write # npm trusted publishing + provenance
      contents: read
    env:
      # ./ prefix: without it npm treats "release/<file>" as a GitHub owner/repo spec
      TARBALL_PATH: ./release/${{ needs.release.outputs.tarball }}

    steps:
      - name: Download npm tarball
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: npm-tarball
          path: release

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # Node 24 bundles npm 11 (trusted publishing needs npm >= 11.5.1).
          node-version: '24.22.2'
          registry-url: 'https://registry.npmjs.org'

      - name: Verify npm version and tarball
        env:
          TARBALL: ${{ needs.release.outputs.tarball }}
          EXPECTED_SHA256: ${{ needs.release.outputs.sha256 }}
          VERSION: ${{ needs.release.outputs.version }}
        run: |
          npm_version=$(npm --version)
          if [ "$(printf '%s\n' "11.5.1" "$npm_version" | sort -V | head -n1)" != "11.5.1" ]; then
            echo "::error::npm $npm_version is too old for trusted publishing (need >= 11.5.1)"
            exit 1
          fi
          case "$TARBALL" in */*|'') echo "::error::Bad tarball name"; exit 1 ;; esac
          echo "$EXPECTED_SHA256  $TARBALL_PATH" | sha256sum --check -
          case "$VERSION" in *-*) echo "::error::Prerelease versions are not published from this workflow"; exit 1 ;; esac

      - name: Publish
        run: npm publish "$TARBALL_PATH" --provenance --access public --ignore-scripts
