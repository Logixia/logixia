name: Release (manual fallback)

# The primary release path is the `release` job inside ci.yml.
# This workflow exists only as a manual escape hatch — use it when you
# need to cut a release without pushing a new commit (e.g. after fixing
# a broken NPM_TOKEN or recovering from a failed release mid-flight).
on:
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false # never cancel an in-flight release — queue instead

jobs:
  release:
    name: Semantic Release (manual)
    runs-on: ubuntu-latest
    permissions:
      contents: write # push release tag + chore(release) commit
      issues: write # comment on released issues
      pull-requests: write # comment on released PRs
      id-token: write # npm provenance attestation

    steps:
      - name: Checkout (full history)
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Install dependencies
        env:
          HUSKY: 0 # skip husky install in CI — no local git hooks needed
        run: npm install

      - name: Build
        run: npm run build

      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # npm publish uses OIDC trusted publishing when it is configured for
          # this repo on npmjs.com. NPM_TOKEN is the fallback: when the secret is
          # set, @semantic-release/npm publishes with it; when it is unset this is
          # an empty string and OIDC is used as before.
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: true
          HUSKY: 0 # skip commit-msg / pre-commit hooks on the auto-generated release commit
        run: npx --yes -p semantic-release@25 -p conventional-changelog-conventionalcommits@8 semantic-release
