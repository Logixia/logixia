name: Bundle Size

# Builds the package and reports the gzipped size of each entry in the job
# summary. The job fails if an entry exceeds its limit in package.json
# ("size-limit"). No third-party action and no write token.
on:
  pull_request:
    branches: [main, develop]

permissions: {}

jobs:
  size-limit:
    name: Bundle Size
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build
        run: npm run build

      - name: Size Limit
        run: |
          echo '### Bundle size' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          set -o pipefail
          status=0
          npm run --silent size 2>&1 | tee -a "$GITHUB_STEP_SUMMARY" || status=$?
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          exit "$status"
