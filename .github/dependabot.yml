version: 2

updates:
  # ── npm dependencies ─────────────────────────────────────────────
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '09:00'
      timezone: Asia/Kolkata
    open-pull-requests-limit: 10
    cooldown:
      default-days: 7
      semver-major-days: 14
    # Group all non-major updates into a single PR to reduce noise
    groups:
      eslint-and-plugins:
        patterns:
          - 'eslint*'
          - '@eslint/*'
          - 'typescript-eslint'
          - '@typescript-eslint/*'
          - 'eslint-plugin-*'
          - 'eslint-config-*'
      testing:
        patterns:
          - 'jest*'
          - '@jest/*'
          - 'ts-jest'
          - '@types/jest'
      typescript:
        patterns:
          - 'typescript'
          - 'tsdown'
          - 'ts-node'
          - '@types/*'
      husky-and-commitlint:
        patterns:
          - 'husky'
          - '@commitlint/*'
          - 'commitizen'
          - 'cz-*'
          - 'lint-staged'
    labels:
      - 'dependencies'
      - 'automated'
    commit-message:
      prefix: 'chore'
      prefix-development: 'chore'
      include: scope
    # Ignore major updates for stable core deps — review manually
    ignore:
      - dependency-name: 'typescript'
        update-types: ['version-update:semver-major']
      - dependency-name: '@nestjs/*'
        update-types: ['version-update:semver-major']
      # Keep type definitions on the oldest-supported Node major (engines)
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
      # Must stay on 8.x: v9+ needs conventional-changelog-writer 9, but
      # @semantic-release/release-notes-generator ships writer 8.
      - dependency-name: 'conventional-changelog-conventionalcommits'
        update-types: ['version-update:semver-major']

  # ── Documentation website (VitePress) ─────────────────────────────
  - package-ecosystem: npm
    directory: /website
    schedule:
      interval: weekly
      day: monday
      time: '09:00'
      timezone: Asia/Kolkata
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
      semver-major-days: 14
    groups:
      website-minor-and-patch:
        update-types:
          - minor
          - patch
    labels:
      - 'dependencies'
      - 'documentation'
      - 'automated'
    commit-message:
      prefix: 'chore'
      prefix-development: 'chore'
      include: scope

  # ── GitHub Actions ────────────────────────────────────────────────
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '09:00'
      timezone: Asia/Kolkata
    open-pull-requests-limit: 5
    # semver-*-days are not supported for the github-actions ecosystem, so
    # use the longer window for every actions update
    cooldown:
      default-days: 14
    labels:
      - 'github-actions'
      - 'automated'
    commit-message:
      prefix: 'ci'
      include: scope
